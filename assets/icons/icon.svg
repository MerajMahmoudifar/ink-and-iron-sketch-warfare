<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 8" opacity="0.4"/>
  
  <!-- Blueprint Grid Lines -->
  <path d="M 64 0 V 512 M 128 0 V 512 M 192 0 V 512 M 256 0 V 512 M 320 0 V 512 M 384 0 V 512 M 448 0 V 512" stroke="#3b82f6" stroke-width="1" opacity="0.12"/>
  <path d="M 0 64 H 512 M 0 128 H 512 M 0 192 H 512 M 0 256 H 512 M 0 320 H 512 M 0 384 H 512 M 0 448 H 512" stroke="#3b82f6" stroke-width="1" opacity="0.12"/>

  <!-- Tactical Reticle Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Central Crossed Drafting Quills / Pencils & Sword Motif -->
  <!-- Pencil 1 (Left to Right) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <rect x="236" y="110" width="40" height="250" rx="4" fill="url(#goldGrad)"/>
    <polygon points="236,360 276,360 256,420" fill="#f3ede2"/>
    <polygon points="248,395 264,395 256,420" fill="#0f172a"/>
    <rect x="236" y="90" width="40" height="24" rx="3" fill="#cbd5e1"/>
  </g>
  
  <!-- Sword 2 (Right to Left) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <path d="M 248 100 L 256 75 L 264 100 L 264 360 L 256 375 L 248 360 Z" fill="url(#blueGrad)"/>
    <!-- Guard -->
    <rect x="216" y="360" width="80" height="16" rx="4" fill="url(#goldGrad)"/>
    <!-- Pommel & Hilt -->
    <rect x="248" y="376" width="16" height="45" rx="3" fill="#334155"/>
    <circle cx="256" cy="432" r="12" fill="url(#goldGrad)"/>
  </g>

  <!-- Corner Blueprint Accents -->
  <path d="M 40 70 H 70 V 40" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 472 70 H 442 V 40" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 40 442 H 70 V 472" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 472 442 H 442 V 472" fill="none" stroke="#f59e0b" stroke-width="3"/>
</svg>
